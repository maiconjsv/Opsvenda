{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block content_guest %}
<div class="login-page">
  <form class="card login-card" method="post">
    {% include "_csrf_field.html" %}
    <h1>Recuperar senha</h1>
    <p class="muted">Informe seu usuário para ver sua pergunta de segurança</p>
    <label>Usuário</label>
    <input type="text" name="username" value="{{ username or '' }}" autofocus required>
    <button type="submit" class="btn btn-primary btn-block">Continuar</button>
    <p class="muted" style="margin-top:12px;"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
  </form>
</div>
{% endblock %}
