{% extends "base.html" %}
{% block title %}Configuração inicial{% endblock %}
{% block content_guest %}
<div class="login-page">
  <form class="card login-card" method="post">
    {% include "_csrf_field.html" %}
    <h1>OpsVenda</h1>
    <p class="muted">Primeiro acesso — crie o usuário administrador</p>
    <label>Usuário</label>
    <input type="text" name="username" value="{{ username or '' }}" autofocus required>
    <label>Senha</label>
    <input type="password" name="password" minlength="6" required>
    <label>Confirmar senha</label>
    <input type="password" name="confirm_password" minlength="6" required>
    <label>Pergunta de segurança</label>
    <select name="security_question" required>
      <option value="">Selecione...</option>
      {% for q in questions %}
      <option value="{{ q }}" {{ 'selected' if security_question == q }}>{{ q }}</option>
      {% endfor %}
    </select>
    <p class="muted" style="margin-top:-6px;">Usada pra recuperar o acesso se você esquecer a senha — guarde a resposta.</p>
    <label>Resposta</label>
    <input type="text" name="security_answer" required>
    <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
  </form>
</div>
{% endblock %}
