<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OpsVenda{% endblock %} · Painel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if current_user.is_authenticated %}
  <div class="app-shell">
    <nav class="sidebar">
      <div class="brand">OpsVenda</div>
      <a href="{{ url_for('dashboard.index') }}" class="{{ 'active' if request.endpoint == 'dashboard.index' }}">Dashboard</a>
      <a href="{{ url_for('products.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('products.') }}">Produtos</a>
      <a href="{{ url_for('sales.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('sales.') }}">Vendas</a>
      <a href="{{ url_for('margin_profiles.index') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('margin_profiles.') }}">Perfis de Margem</a>
      <div class="sidebar-footer">
        <span>{{ current_user.username }}</span>
        <a href="{{ url_for('auth.logout') }}">Sair</a>
      </div>
    </nav>
    <main class="content">
      {% include "_flash.html" %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
    {% include "_flash.html" %}
    {% block content_guest %}{% endblock %}
  {% endif %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
