# Deploy na VPS compartilhada: o nginx (ncas-web, do projeto necasecanecas)
# faz o TLS e encaminha opsvenda.montiqtech.com.br para opsvenda-app:5000
# pela rede externa necasecanecas_default.
services:
  app:
    build: .
    container_name: opsvenda-app
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      DATABASE_URL: postgresql+psycopg://opsvenda:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/opsvenda
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MP_SANDBOX: ${MP_SANDBOX:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_instance:/app/instance
    expose:
      - "5000"
    networks:
      - default
      - necasecanecas_default
    mem_limit: 300m
    memswap_limit: 300m

  db:
    image: postgres:16-alpine
    container_name: opsvenda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsvenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opsvenda
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsvenda -d opsvenda"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 200m
    memswap_limit: 200m
    # Tuning conservador: VPS de 2GB compartilhada com outros apps.
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=30

volumes:
  app_instance:
  db_data:

networks:
  necasecanecas_default:
    external: true
