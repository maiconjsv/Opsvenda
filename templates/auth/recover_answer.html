{% extends "base.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block content_guest %}
<div class="login-page">
  <form class="card login-card" method="post">
    {% include "_csrf_field.html" %}
    <h1>Recuperar senha</h1>
    <p class="muted">{{ user.security_question }}</p>
    <label>Resposta</label>
    <input type="text" name="security_answer" autofocus required>
    <label>Nova senha</label>
    <input type="password" name="password" minlength="6" required>
    <label>Confirmar nova senha</label>
    <input type="password" name="confirm_password" minlength="6" required>
    <button type="submit" class="btn btn-primary btn-block">Redefinir senha</button>
    <p class="muted" style="margin-top:12px;"><a href="{{ url_for('auth.login') }}">Voltar ao login</a></p>
  </form>
</div>
{% endblock %}
